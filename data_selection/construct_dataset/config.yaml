global_sampling:
  sizes: 1000

domains:
  math:
    datasets:
      - name: "TIGER-Lab/MathInstruct"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "instruction", output: "output"}
      - name: "nvidia/Nemotron-SFT-Math-v3"
        format: "sharegpt"
        split: "train"
        mapping: 
          messages: "messages"
      - name: "allenai/tulu-3-sft-personas-math-filtered"
        format: "sharegpt"
        split: "train"
        mapping: 
          messages: "messages"
      - name: "AI-MO/NuminaMath-1.5"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "problem", output: "solution"}
      - name: "microsoft/orca-math-word-problems-200k"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "question", output: "answer"}
      - name: "nvidia/OpenMathReasoning"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "problem", output: "generated_solution"}
      - name: "zwhe99/DeepMath-103K"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "problem", output: ["r1_solution_1", "r1_solution_2", "r1_solution_3"]}
      - name: "Jackrong/GPT-OSS-120B-Distilled-Reasoning-math"
        split: "train"
        mapping: {instruction: "Input", output: "CoT_Native_Reasoning"}
      - name: "amao0o0/CoinMath"
        format: "sharegpt"
        split: "train"
        mapping: 
          messages: "messages"
      - name: "RabotniKuma/Fast-Math-R1-SFT"
        split: "train"
        mapping: {instruction: "problem", output: "generation"}
      - name: "nlile/24-game"
        split: "train"
        system_prompt: "你是一个24点专家，根据给的数字卡牌，给出如何得到24的方案"
        mapping: {instruction: "numbers", output: "solutions"}
      - name: "SallyTan/MathMC"
        split: "train"
        mapping:
          instruction: "quest_stem.text"
          options: "quest_stem.options"
          reasoning: "quest_ref.analyses.0"
          output: "quest_ref.texts.0"
        formatters:
          options: "format_MathMC_options"
      - name: "kaushik-harsh-99/math-sft-solutions-no-cot"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "instruction", output: "output"}
      - name: "ycchen/Crystal-Math-Preview"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "problem", output: "solution"}
      - name: "notbadai/math_reasoning"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "prompt", output: ["reasoning", "answer"]}
      - name: "nvidia/AceReason-1.1-SFT"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "input", output: "output", "domain": "math"}
      - name: "Modotte/MathX-5M"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "problem", output: "generated_solution"}
      - name: "tiedong/goat"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "instruction", input: "input", output: "generated_solution"}
      - name: "camel-ai/math"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "message_1", output: "message_2"}
  
  science:
    datasets:
      - name: "Locutusque/arc-cot"
        format: "alpaca"
        split: "train"
        mapping: {instruction: "question", output: "cot"}
      - name: "anisha2102/RaR-Science"
        format: "alpaca"
        split: "train"	
        mapping: {instruction: "question", output: "reference_answer"}
      - name: "derek-thomas/ScienceQA"
        split: "train"
        mapping: 
          instruction: "question"
          input: "input"
          options: "choices"
          output: "answer"
          image: "image"
        formatters:
          options: "format_ScienceQA_options"
          output: "format_ScienceQA_output"
        filters:
          - "filter_ScienceQA"
      - name: "allenai/sciq"
        split: "train"
        mapping: 
          instruction: "question"
          options: ["correct_answer", "distractor1", "distractor2", "distractor3"]
          input: "support"
          output: "correct_answer"
        formatters:
          options: "format_sciq_options"
      - name: "summykai/chemistry-sft-ultra"
        format: "sharegpt"
        split: "train"
        mapping: 
          messages: "messages"
      - name: "gravermistakes/WildSci"
        split: "train"
        mapping:
          instruction: "question"
          options: "options"
          answer: "answer"
          output: "rationale"
          reasoning_answer: "rationale_answer"
        formatters:
          options: "format_WildSci_options"
        filters:
          - "filter_WildSci"

  finance:
    datasets:
      - name: "BUPT-Reasoning-Lab/FinanceReasoning"
        split: "train"
        mapping: 
          instruction: "question"
          input: "context"
          output: "ground_truth"
        formatters:
          input: "format_FinanceReasoning_input"
      - name: "likhitjuttada/finance-reasoning-sft-dataset"
        format: "sharegpt"
        split: "train"
        mapping: 
          messages: "messages"
      - name: "VedantPadwal/quantitative-finance-reasoning"
        split: "train"
        mapping: {instruction: "question", output: "reasoning_trace"}
      - name: "nri-ai/nri-fin-reasoning"
        format: "sharegpt"
        split: "train"
        mapping: 
          messages: "messages"
      - name: "neoyipeng/natural_reasoning_finance"
        split: "train"
        mapping: 
          instruction: "question"
          answer: "reference_answer"
          output: "responses"
        formatters:
          input: "format_natural_reasoning_finance_output"
      - name: "sujet-ai/Sujet-Finance-Instruct-177k"
        split: "train"
        mapping: 
          system_prompt: "system_prompt"
          instruction: "user_prompt"
          input: "inputs"
          output: "answer"
      - name: "BAAI/IndustryInstruction_Finance-Economics"
        format: "sharegpt"
        split: "train"
        mapping: 
          messages: "conversations"
          from: "from"
          user: "human"
          content: "content"
          assistant: "gpt"
      - name: "gbharti/finance-alpaca"
        split: "train"
        mapping: {instruction: "instruction", output: "output"}
      - name: "jdecim/pit-earnings-call-qa"
        split: "train"
        mapping: {instruction: "question", input: "context", output: "answer"}
      - name: "Infiniaai/eu-financial-regulatory-qa"
        format: "sharegpt"
        split: "train"
        mapping: 
          messages: "messages"
          from: "role"
          system: "system"
          user: "user"
          content: "content"
          assistant: "assistant"
      - name: "Ayansk11/FinSenti-Dataset"
        split: "sft_train.jsonl"
        mapping: {instruction: "instruction", input: "input", output: "output"}
      - name: "ash0t/finance-slm-distillation-data"
        split: "train"
        mapping: {instruction: "instruction", output: "output"}
      - name: "tahamajs/bitcoin-sllm-instruct"
        split: "train"
        mapping: {instruction: "instruction", output: "output"}
      - name: "OpenDataArena/ODA-Fin-SFT-318k"
        split: "train"
        mapping: {instruction: "instruction", output: "output"}
      - name: "nvidia/Nemotron-SpecializedDomains-Finance-v1"
        split: "train"
        mapping: {instruction: "instruction", output: "output"}
      - name: "ckerf/arb-instruct-v1"
        split: "train"
        mapping: {instruction: "instruction", output: "output"}
      - name: "uaytug/fumea-dataset"
        split: "train"
        mapping: {instruction: "text", output: "label"}
      - name: "Akhil-Theerthala/PersonalFinance_v2"
        split: "train"
        mapping: {instruction: "instruction", output: "output"}
      - name: "Akhil-Theerthala/PersonalFinance-CoTR-V2-Compact"
        split: "train"
        mapping: {instruction: "instruction", output: "output"}

